
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Click & Collect</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="spiel">

        <h1>🪙 Click & Collect</h1>

        <p>Deine Münzen:</p>
        <h2 id="punkte">0</h2>

        <button id="sammeln">
            Münze sammeln!
        </button>

        <div class="shop">
            <h2>🛒 Upgrade-Shop</h2>

            <p>
                Münzen pro Klick:
                <strong id="klick-wert">5</strong>
            </p>

            <button id="upgrade">
                Upgrade kaufen
                (<span id="upgrade-preis">20</span> Münzen)
            </button>
        </div>

    </div>
</body>

</html>
